[package]
name = "lokahi"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.25", features = ["macros", "rt-multi-thread", "process", "io-util"] }
ratatui = "0.20"
crossterm = "0.26"
reqwest = { version = "0.11", features = ["json"] }
sysinfo = "0.28"
rusqlite = { version = "0.28", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1"
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
rustyline = "13"

[dev-dependencies]
tempfile = "3"
